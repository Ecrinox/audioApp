<!DOCTYPE html>
<html lang="es" data-theme="brutal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Audio-Queue">
    
    <!-- Íconos de App -->
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=AQ&background=050505&color=00ff41&size=512&font-size=0.4&bold=true">
    <link rel="icon" type="image/png" href="https://ui-avatars.com/api/?name=AQ&background=050505&color=00ff41&size=512&font-size=0.4&bold=true">

    <title>Audio-Queue</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        base: 'var(--bg-base)',
                        panel: 'var(--bg-panel)',
                        main: 'var(--text-main)',
                        accent: 'var(--accent)',
                        danger: 'var(--danger)',
                        borderMain: 'var(--border-main)'
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           SISTEMA DE SKINS (CARCASAS)
           ========================================================= */
        :root, [data-theme="brutal"] {
            --bg-base: #050505;
            --bg-panel: #000000;
            --text-main: #00ff41;
            --text-muted: rgba(0, 255, 65, 0.6);
            --accent: #00ff41;
            --danger: #ff6600;
            --border-main: #00ff41;
            --border-danger: #ff6600;
            --font-sys: 'JetBrains Mono', monospace;
            --ui-shadow: 4px 4px 0px var(--accent);
            --ui-shadow-danger: 3px 3px 0px var(--danger);
            --radius: 0px;
            --slider-track: #333333;
        }

        [data-theme="retro"] {
            --bg-base: #e6e2d3; 
            --bg-panel: #d6d1c0; 
            --text-main: #2b2b2b; 
            --text-muted: rgba(43, 43, 43, 0.6);
            --accent: #b22222; 
            --danger: #5c4033; 
            --border-main: #2b2b2b;
            --border-danger: #5c4033;
            --font-sys: 'Courier New', Courier, monospace;
            --ui-shadow: 2px 2px 0px rgba(0,0,0,0.3);
            --ui-shadow-danger: 2px 2px 0px rgba(0,0,0,0.3);
            --radius: 6px;
            --slider-track: #a9a9a9;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-sys);
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: none;
            transition: background-color 0.3s, color 0.3s;
        }
        
        .brutal-border {
            border: 2px solid var(--border-main);
            box-shadow: var(--ui-shadow);
            border-radius: var(--radius);
            transition: all 0.2s;
        }
        
        .brutal-border-orange {
            border: 2px solid var(--border-danger);
            box-shadow: var(--ui-shadow-danger);
            border-radius: var(--radius);
            transition: all 0.2s;
        }

        .brutal-input {
            background-color: var(--bg-panel);
            border: 2px solid var(--border-main);
            color: var(--text-main);
            border-radius: var(--radius);
            outline: none;
            transition: all 0.2s;
        }
        
        .brutal-input:focus {
            box-shadow: var(--ui-shadow);
        }

        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        #app-container {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            height: 100vh; 
            height: 100dvh; 
            display: flex;
            flex-direction: column;
        }

        #scroll-area {
            flex: 1;
            overflow-y: auto;
        }

        #player-container {
            border-top: 4px solid var(--border-main);
            background-color: var(--bg-panel);
            transition: background-color 0.3s;
        }
        
        /* Sliders */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            background: var(--accent);
            cursor: pointer;
            margin-top: -6px;
            border-radius: var(--radius);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: var(--slider-track);
        }
        input[type=range]:disabled::-webkit-slider-thumb {
            background: #888;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="selection:bg-accent selection:text-base">

    <div id="app-container">
        
        <div id="scroll-area" class="p-4 flex flex-col gap-6">
            
            <!-- Header -->
            <header class="flex justify-between items-end border-b-4 border-borderMain pb-2">
                <div>
                    <h1 class="text-2xl font-extrabold uppercase tracking-tighter leading-none">AUDIO<br>QUEUE</h1>
                </div>
                <div class="text-right flex flex-col items-end gap-1">
                    <button id="btn-theme" class="text-[9px] uppercase font-bold border border-borderMain px-1 bg-panel hover:bg-main hover:text-base transition-colors cursor-pointer">
                        [ SKIN: BRUTAL ]
                    </button>
                    <div class="text-[10px] uppercase font-bold opacity-80 mt-1">
                        <p>Soberanía_Local</p>
                        <p>v1.13.0 (Origen Puro)</p>
                    </div>
                </div>
            </header>

            <!-- Ingesta Manual -->
            <section class="flex flex-col gap-3">
                <label class="text-sm font-bold uppercase">> Ingesta_Manual (URL):</label>
                <div class="flex gap-2 h-12">
                    <input type="url" id="url-input" placeholder="https://..." class="brutal-input flex-1 px-3 text-sm" autocomplete="off">
                    <button id="btn-ingest" class="brutal-border bg-accent text-base px-4 font-extrabold uppercase hover:opacity-80 transition-opacity">
                        Extraer
                    </button>
                </div>
                <div id="status-msg" class="text-xs hidden text-danger font-bold"></div>
            </section>

            <!-- Fuentes RSS Automáticas -->
            <section class="flex flex-col gap-3 border-t-2 border-dashed border-borderMain pt-4">
                <div class="flex justify-between items-center">
                    <label class="text-sm font-bold uppercase">> Fuentes_RSS_Automáticas:</label>
                    <button id="btn-toggle-sources" class="text-xs uppercase text-accent hover:opacity-70">[Editar]</button>
                </div>
                
                <div id="sources-config" class="hidden flex-col gap-2">
                    <textarea id="sources-input" rows="3" placeholder="https://ejemplo.com/feed&#10;Una URL por línea..." class="brutal-input p-2 text-xs w-full leading-tight font-mono"></textarea>
                    <p class="text-[9px] opacity-70">// Pegá links RSS de Substacks, Medium o blogs periodísticos.</p>
                </div>
                
                <button id="btn-sync" class="brutal-border bg-accent text-base px-4 py-3 font-extrabold uppercase hover:opacity-80 transition-opacity shadow-none text-sm tracking-widest">
                    [ Sincronizar Novedades ]
                </button>
            </section>

            <!-- Playlist -->
            <section class="flex flex-col gap-3">
                <div class="flex justify-between items-end">
                    <label class="text-sm font-bold uppercase">> Cola_de_Lectura:</label>
                    <button id="btn-clear" class="text-xs text-danger hover:opacity-70 uppercase">[Purgar]</button>
                </div>
                
                <ul id="playlist-container" class="flex flex-col gap-3">
                    <!-- Los items se inyectan acá vía JS -->
                </ul>
            </section>
            
            <div class="h-24"></div>
        </div>

        <!-- Reproductor Fijo -->
        <footer id="player-container" class="p-4 flex flex-col gap-3">
            <div class="flex justify-between items-center">
                <div class="truncate pr-4 text-sm font-bold" id="now-playing-title">
                    [NO_DATA_SELECTED]
                </div>
                <div class="text-xs border border-borderMain bg-panel text-main rounded-[var(--radius)]">
                    <select id="voice-select" class="bg-panel text-main outline-none max-w-[130px] truncate p-1 cursor-pointer font-bold uppercase appearance-none rounded-[var(--radius)]">
                        <option value="">VOZ: --</option>
                    </select>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <!-- Botonera tipo grabador -->
                <div class="flex gap-2 w-1/3">
                    <button id="btn-play" class="flex-1 brutal-border-orange bg-panel text-danger py-3 flex justify-center items-center hover:opacity-80 transition-colors" title="Play">
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <button id="btn-pause" class="flex-1 brutal-border-orange bg-panel text-danger py-3 flex justify-center items-center hover:opacity-80 transition-colors" title="Pause">
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button id="btn-stop" class="flex-1 brutal-border-orange bg-panel text-danger py-3 flex justify-center items-center hover:opacity-80 transition-colors" title="Stop">
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                    </button>
                </div>
                
                <div class="flex-1 flex flex-col gap-1">
                    <label class="text-xs uppercase flex justify-between">
                        <span>Velocidad</span>
                        <span id="rate-val">1.0x</span>
                    </label>
                    <div class="relative w-full">
                        <input type="range" id="rate-slider" min="-2" max="2" step="0.1" value="0" class="w-full">
                        <div class="flex justify-between text-[9px] opacity-70 font-bold uppercase mt-1">
                            <span>-2x</span>
                            <span>Normal</span>
                            <span>+2x</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Timeline de Progreso Interactivo -->
            <div class="w-full mt-4 relative flex items-center">
                <input type="range" id="progress-slider" min="0" max="100" step="0.1" value="0" class="w-full" disabled>
            </div>
            
            <!-- SE ELIMINÓ EL bg-audio. Volvemos al motor puro. -->
        </footer>

    </div>

    <!-- Script Principal -->
    <script>
        // --- MANEJO DEL TEMA VISUAL (SKINS) ---
        const btnTheme = document.getElementById('btn-theme');
        let currentTheme = localStorage.getItem('audioQueue_theme') || 'brutal';
        document.documentElement.setAttribute('data-theme', currentTheme);
        updateThemeBtnLabel();

        btnTheme.addEventListener('click', () => {
            currentTheme = currentTheme === 'brutal' ? 'retro' : 'brutal';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('audioQueue_theme', currentTheme);
            updateThemeBtnLabel();
        });

        function updateThemeBtnLabel() {
            btnTheme.innerText = currentTheme === 'brutal' ? '[ SKIN: BRUTAL ]' : '[ SKIN: 70s REC ]';
        }

        /**
         * ESTADO Y BASE DE DATOS LOCAL
         */
        let playlist = JSON.parse(localStorage.getItem('audioQueue_db_v1')) || [];
        
        // --- AUTO-CORRECTOR DE ORDEN ---
        playlist.sort((a, b) => {
            const parseDateStr = (dateStr, id) => {
                if (dateStr && dateStr.includes('/')) {
                    const parts = dateStr.split('/');
                    if (parts.length === 3) return new Date(parts[2], parts[1] - 1, parts[0]).getTime();
                }
                return parseInt(id) || 0;
            };
            return parseDateStr(b.date, b.id) - parseDateStr(a.date, a.id);
        });
        localStorage.setItem('audioQueue_db_v1', JSON.stringify(playlist));

        let isPlaying = false;
        let currentVoice = null;
        let currentItemIndex = -1;
        
        // --- VARIABLES DEL MOTOR PURO ---
        let fullText = "";
        let currentCharIndex = 0;
        let isDraggingProgress = false; 

        // Referencias DOM
        const urlInput = document.getElementById('url-input');
        const btnIngest = document.getElementById('btn-ingest');
        const statusMsg = document.getElementById('status-msg');
        const playlistContainer = document.getElementById('playlist-container');
        const btnClear = document.getElementById('btn-clear');
        const sourcesInput = document.getElementById('sources-input');
        const btnToggleSources = document.getElementById('btn-toggle-sources');
        const sourcesConfig = document.getElementById('sources-config');
        const btnSync = document.getElementById('btn-sync');
        
        const nowPlayingTitle = document.getElementById('now-playing-title');
        const voiceSelect = document.getElementById('voice-select');
        const btnPlay = document.getElementById('btn-play');
        const btnPause = document.getElementById('btn-pause');
        const btnStop = document.getElementById('btn-stop');
        const rateSlider = document.getElementById('rate-slider');
        const rateVal = document.getElementById('rate-val');
        const progressSlider = document.getElementById('progress-slider');

        let sources = JSON.parse(localStorage.getItem('audioQueue_sources_v1')) || [];
        sourcesInput.value = sources.join('\n');

        /**
         * INICIALIZACIÓN DE VOCES (Búsqueda obsesiva de Mónica Premium)
         */
        let availableVoices = [];

        function initVoices() {
            availableVoices = window.speechSynthesis.getVoices();
            if (availableVoices.length === 0) return;

            voiceSelect.innerHTML = ''; 

            const spanishVoices = availableVoices.filter(v => v.lang.startsWith('es'));
            const voicesToShow = spanishVoices.length > 0 ? spanishVoices : availableVoices;

            let bestVoice = voicesToShow.find(v => v.name.includes('Monica') && (v.name.includes('Enhanced') || v.name.includes('Premium')));
            if (!bestVoice) bestVoice = voicesToShow.find(v => v.name.includes('Monica'));
            if (!bestVoice) bestVoice = voicesToShow.find(v => v.name.includes('Paulina') && (v.name.includes('Enhanced') || v.name.includes('Premium')));
            if (!bestVoice) bestVoice = voicesToShow.find(v => v.name.includes('Premium') || v.name.includes('Enhanced'));
            if (!bestVoice) bestVoice = voicesToShow[0];

            voicesToShow.forEach((voice) => {
                const option = document.createElement('option');
                option.value = voice.voiceURI;
                let shortName = voice.name.replace(/\s*\(.*?\)\s*/g, '');
                option.textContent = shortName;
                if (bestVoice && voice.voiceURI === bestVoice.voiceURI) {
                    currentVoice = voice;
                    option.selected = true;
                }
                voiceSelect.appendChild(option);
            });
        }

        voiceSelect.addEventListener('change', (e) => {
            currentVoice = availableVoices.find(v => v.voiceURI === e.target.value);
            if (isPlaying && currentItemIndex !== -1) {
                window.speechSynthesis.cancel();
                playFromCurrentIndex(); 
            }
        });

        window.speechSynthesis.onvoiceschanged = initVoices;
        initVoices();

        /**
         * LIMPIEZA DE TEXTO (JINA AI -> LECTURA PURA)
         */
        function cleanJinaText(rawText) {
            let contentStart = rawText.indexOf('Markdown Content:');
            let baseText = contentStart !== -1 ? rawText.substring(contentStart + 17) : rawText;

            return baseText
                .replace(/Title:.*?(\n|$)/gi, '')
                .replace(/URL Source:.*?(\n|$)/gi, '')
                .replace(/Published Time:.*?(\n|$)/gi, '')
                .replace(/\[.*?\]\(.*?\)/g, '') 
                .replace(/[*_#`=>-\[\]]/g, ' ') 
                .replace(/(https?:\/\/[^\s]+)/g, '') 
                .replace(/\b(Menú|Navegación|Buscar|Compartir|Search|Log in|Sign up|Suscribirse)\b/gi, '') 
                .replace(/\b(El Cohete a la Luna|Substack|Medium)\b/gi, '') 
                .replace(/\b(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\s+\d{1,2},?\s+\d{4}\b/gi, '') 
                .replace(/\s{2,}/g, ' ') 
                .trim();
        }

        /**
         * EXTRACCIÓN MANUAL Y RSS
         */
        btnIngest.addEventListener('click', async () => {
            const url = urlInput.value.trim();
            if (!url) return;
            btnIngest.disabled = true;
            btnIngest.innerText = "...";
            statusMsg.classList.remove('hidden');
            statusMsg.innerText = ">> Procesando URL...";

            try {
                const proxyUrl = `https://r.jina.ai/${url}`;
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("Fallo en la extracción.");
                const text = await response.text();
                
                let titleMatch = text.match(/Title:\s*(.*)/i);
                let title = titleMatch && titleMatch[1] ? titleMatch[1].trim() : "Extracción Manual";
                if(title.length > 60) title = title.substring(0, 60) + "...";
                
                let cleanText = cleanJinaText(text);

                const newItem = {
                    id: Date.now().toString(),
                    url: url,
                    title: title,
                    text: cleanText,
                    author: 'Extracción Manual',
                    date: new Date().toLocaleDateString('es-AR'),
                    status: 'Pendiente'
                };

                if (currentItemIndex !== -1) currentItemIndex++;
                playlist.unshift(newItem); 
                savePlaylist();
                renderPlaylist();
                
                urlInput.value = '';
                statusMsg.innerText = ">> Añadido a la cola.";
                setTimeout(() => statusMsg.classList.add('hidden'), 3000);
            } catch (error) {
                console.error(error);
                statusMsg.innerText = "[!] ERROR: " + error.message;
            } finally {
                urlInput.disabled = false;
                btnIngest.disabled = false;
                btnIngest.innerText = "EXTRAER";
            }
        });

        btnToggleSources.addEventListener('click', () => {
            sourcesConfig.classList.toggle('hidden');
            sourcesConfig.classList.toggle('flex');
            btnToggleSources.innerText = sourcesConfig.classList.contains('hidden') ? '[Editar]' : '[Ocultar]';
        });

        sourcesInput.addEventListener('input', () => {
            sources = sourcesInput.value.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            localStorage.setItem('audioQueue_sources_v1', JSON.stringify(sources));
        });

        btnSync.addEventListener('click', async () => {
            if (sources.length === 0) {
                alert(">> Configura al menos una fuente RSS primero.");
                return;
            }

            btnSync.disabled = true;
            let originalText = btnSync.innerText;
            btnSync.innerText = "[ BUSCANDO EN LA RED... ]";
            statusMsg.classList.remove('hidden');

            let newArticlesFound = 0;

            try {
                for (const feedUrl of sources) {
                    statusMsg.innerText = `>> Leyendo feed...`;
                    const rssApiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`;
                    const response = await fetch(rssApiUrl);
                    if (!response.ok) continue;
                    
                    const data = await response.json();
                    if (data.status !== 'ok' || !data.items) continue;

                    const recentItems = data.items.slice(0, 3).reverse();
                    
                    for (const item of recentItems) {
                        const itemUrl = item.link;
                        const exists = playlist.some(p => p.url === itemUrl);
                        
                        if (!exists) {
                            statusMsg.innerText = `>> Ingestando nuevo...`;
                            const proxyUrl = `https://r.jina.ai/${itemUrl}`;
                            const jinaRes = await fetch(proxyUrl);
                            
                            if (jinaRes.ok) {
                                const text = await jinaRes.text();
                                let cleanText = cleanJinaText(text);
                                let pubDate = item.pubDate ? new Date(item.pubDate).toLocaleDateString('es-AR') : new Date().toLocaleDateString('es-AR');
                                let authorName = item.author || 'Redacción';

                                const newItem = {
                                    id: Date.now().toString() + Math.random().toString(16).slice(2),
                                    url: itemUrl,
                                    title: item.title,
                                    text: cleanText,
                                    author: authorName,
                                    date: pubDate,
                                    status: 'Pendiente'
                                };
                                
                                if (currentItemIndex !== -1) currentItemIndex++;
                                playlist.unshift(newItem);
                                newArticlesFound++;
                                savePlaylist();
                                renderPlaylist();
                            }
                            await new Promise(resolve => setTimeout(resolve, 1000));
                        }
                    }
                }
                statusMsg.innerText = `>> Completado. ${newArticlesFound} nuevas notas.`;
            } catch (error) {
                console.error("Error sync:", error);
                statusMsg.innerText = "[!] ERROR.";
            } finally {
                btnSync.disabled = false;
                btnSync.innerText = originalText;
                setTimeout(() => statusMsg.classList.add('hidden'), 5000);
            }
        });

        /**
         * RENDERIZADO Y LÓGICA DE PLAYLIST
         */
        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            if(playlist.length === 0) {
                playlistContainer.innerHTML = `<li class="text-xs opacity-50 border border-dashed border-borderMain p-4 text-center">No hay datos en la cola.</li>`;
                return;
            }

            playlist.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = `p-3 border-2 ${item.status === 'Escuchando' ? 'border-danger' : 'border-borderMain'} bg-panel flex flex-col gap-1 rounded-[var(--radius)]`;
                let statusColor = item.status === 'Leido' ? 'opacity-50' : (item.status === 'Escuchando' ? 'text-danger' : 'text-accent');
                let displayAuthor = item.author || 'Fuente Web';
                let displayDate = item.date || '--/--/----';

                li.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="text-sm font-bold line-clamp-2 pr-2 leading-tight" title="${item.url}">${item.title}</span>
                        <span class="text-[10px] uppercase border px-1 ${statusColor} border-current flex-shrink-0 rounded-sm">${item.status}</span>
                    </div>
                    <div class="text-[9px] uppercase font-bold flex gap-3 mt-1 tracking-wider opacity-80">
                        <span class="text-danger">> ${displayAuthor}</span>
                        <span>[${displayDate}]</span>
                    </div>
                    <div class="flex justify-between items-center mt-2 pt-2 border-t border-dashed border-borderMain">
                        <div class="flex gap-2">
                            <button onclick="loadAndPlay(${index})" class="text-xs bg-accent text-base px-3 py-1 uppercase font-bold hover:opacity-80 transition-colors rounded-[calc(var(--radius)/2)]">
                                [ Cargar ]
                            </button>
                            <button onclick="copyItemText('${item.id}', this)" class="text-xs border border-borderMain text-main px-3 py-1 uppercase font-bold hover:bg-main hover:text-base transition-colors rounded-[calc(var(--radius)/2)]">
                                [ Copiar ]
                            </button>
                        </div>
                        <button onclick="deleteItem('${item.id}')" class="text-xs text-danger hover:opacity-70">
                            [x]
                        </button>
                    </div>
                `;
                playlistContainer.appendChild(li);
            });
        }

        function savePlaylist() {
            localStorage.setItem('audioQueue_db_v1', JSON.stringify(playlist));
        }

        window.deleteItem = function(id) {
            const indexToDelete = playlist.findIndex(item => item.id === id);
            if (indexToDelete === -1) return;

            if (indexToDelete === currentItemIndex) {
                window.speechSynthesis.cancel();
                isPlaying = false;
                currentItemIndex = -1;
                nowPlayingTitle.innerText = "[NO_DATA_SELECTED]";
                updatePlayerButtons('stopped');
                progressSlider.value = 0;
                progressSlider.disabled = true;
            } else if (indexToDelete < currentItemIndex) {
                currentItemIndex--;
            }

            playlist.splice(indexToDelete, 1);
            savePlaylist();
            renderPlaylist();
        };

        window.copyItemText = function(id, btnElement) {
            const item = playlist.find(p => p.id === id);
            if(!item) return;

            const textArea = document.createElement("textarea");
            textArea.value = `${item.title}\n\n${item.text}`;
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                const originalText = btnElement.innerText;
                btnElement.innerText = "[ ¡COPIADO! ]";
                btnElement.classList.add('bg-accent', 'text-base');
                setTimeout(() => {
                    btnElement.innerText = originalText;
                    btnElement.classList.remove('bg-accent', 'text-base');
                }, 2000);
            } catch (err) {
                console.error('Error al copiar', err);
            }
            document.body.removeChild(textArea);
        };

        btnClear.addEventListener('click', () => {
            if(confirm("¿Seguro que querés borrar todo el conocimiento acumulado?")) {
                playlist = [];
                savePlaylist();
                renderPlaylist();
            }
        });

        // =========================================================
        // MOTOR DE LECTURA NATIVO (PURO)
        // =========================================================

        window.loadAndPlay = function(index) {
            handleStop(); 
            playlist.forEach(p => { if(p.status === 'Escuchando') p.status = 'Pendiente' });
            
            currentItemIndex = index;
            playlist[currentItemIndex].status = 'Escuchando';
            nowPlayingTitle.innerText = playlist[currentItemIndex].title;
            savePlaylist();
            renderPlaylist();

            fullText = playlist[currentItemIndex].text;
            currentCharIndex = 0;
            progressSlider.value = 0;
            progressSlider.disabled = false;

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: playlist[currentItemIndex].title,
                    artist: 'Audio-Queue',
                    album: 'Investigación y Modelos'
                });
            }

            updatePlayerButtons('stopped');
        };

        function updatePlayerButtons(state) {
            btnPlay.classList.replace('bg-danger', 'bg-panel');
            btnPlay.classList.replace('text-panel', 'text-danger');
            btnPause.classList.replace('bg-danger', 'bg-panel');
            btnPause.classList.replace('text-panel', 'text-danger');
            btnStop.classList.replace('bg-danger', 'bg-panel');
            btnStop.classList.replace('text-panel', 'text-danger');

            if (state === 'playing') {
                btnPlay.classList.replace('bg-panel', 'bg-danger');
                btnPlay.classList.replace('text-danger', 'text-panel');
            } else if (state === 'paused') {
                btnPause.classList.replace('bg-panel', 'bg-danger');
                btnPause.classList.replace('text-danger', 'text-panel');
            }
        }

        function handlePlay() {
            if (currentItemIndex === -1) { alert(">> Carga un artículo primero."); return; }
            if (isPlaying) return;
            
            isPlaying = true;
            updatePlayerButtons('playing');
            
            // Si el motor estaba simplemente en pausa, lo reanudamos nativamente
            if (window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
            } else {
                playFromCurrentIndex();
            }
        }

        function handlePause() {
            if (!isPlaying) return;
            isPlaying = false;
            window.speechSynthesis.pause(); 
            updatePlayerButtons('paused');
        }

        function handleStop() {
            if (currentItemIndex === -1) return;
            isPlaying = false;
            window.speechSynthesis.cancel();
            currentCharIndex = 0;
            progressSlider.value = 0;
            updatePlayerButtons('stopped');
            
            btnStop.classList.replace('bg-panel', 'bg-danger');
            btnStop.classList.replace('text-danger', 'text-panel');
            setTimeout(() => {
                btnStop.classList.replace('bg-danger', 'bg-panel');
                btnStop.classList.replace('text-panel', 'text-danger');
            }, 150);
        }

        btnPlay.addEventListener('click', handlePlay);
        btnPause.addEventListener('click', handlePause);
        btnStop.addEventListener('click', handleStop);

        function playFromCurrentIndex() {
            if (currentCharIndex >= fullText.length - 10) {
                handleFinish();
                return;
            }

            // Alimentamos al motor de Apple con un solo bloque continuo.
            // Esto evita que tenga que iniciar procesos de audio repetidamente,
            // eliminando de raíz el "clipping" (comerse consonantes).
            const textToRead = fullText.substring(currentCharIndex);
            const utterance = new SpeechSynthesisUtterance(textToRead);
            
            if (currentVoice) utterance.voice = currentVoice;
            const sliderVal = parseFloat(rateSlider.value);
            utterance.rate = sliderVal >= 0 ? 1 + (sliderVal / 2) : 1 + (sliderVal * 0.25);
            
            const startIndexForThisRun = currentCharIndex;

            // Atamos el slider al progreso real de lectura de Safari
            utterance.onboundary = (e) => {
                if (!isDraggingProgress) {
                    currentCharIndex = startIndexForThisRun + e.charIndex;
                    const percentage = (currentCharIndex / fullText.length) * 100;
                    progressSlider.value = percentage;
                }
            };

            utterance.onend = () => {
                // Solo disparamos el final si no fue cancelado a propósito
                if (isPlaying) {
                    handleFinish();
                }
            };

            utterance.onerror = (e) => {
                if(e.error !== 'canceled' && e.error !== 'interrupted') {
                    console.error("Error TTS:", e);
                    isPlaying = false;
                    updatePlayerButtons('stopped');
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        function handleFinish() {
            isPlaying = false;
            updatePlayerButtons('stopped');
            if (currentItemIndex !== -1 && playlist[currentItemIndex]) {
                playlist[currentItemIndex].status = 'Leido';
                savePlaylist();
                renderPlaylist();
            }
            setTimeout(() => {
                alert(">> Lectura Finalizada");
            }, 500);
        }

        rateSlider.addEventListener('input', (e) => {
            const sliderVal = parseFloat(e.target.value);
            const actualRate = sliderVal >= 0 ? 1 + (sliderVal / 2) : 1 + (sliderVal * 0.25);
            rateVal.innerText = `${actualRate.toFixed(1)}x`;
        });

        rateSlider.addEventListener('change', (e) => {
            if (isPlaying && currentItemIndex !== -1) {
                window.speechSynthesis.cancel();
                playFromCurrentIndex();
            }
        });

        progressSlider.addEventListener('input', () => {
            isDraggingProgress = true;
        });

        progressSlider.addEventListener('change', (e) => {
            isDraggingProgress = false;
            if (currentItemIndex === -1 || fullText.length === 0) return;

            const percentage = parseFloat(e.target.value);
            let targetIndex = Math.floor((percentage / 100) * fullText.length);

            while (targetIndex > 0 && !/\s/.test(fullText[targetIndex - 1])) {
                targetIndex--;
            }

            currentCharIndex = targetIndex;

            if (isPlaying) {
                window.speechSynthesis.cancel();
                playFromCurrentIndex();
            }
        });

        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', handlePlay);
            navigator.mediaSession.setActionHandler('pause', handlePause);
            navigator.mediaSession.setActionHandler('stop', handleStop);
        }

        renderPlaylist();
    </script>
</body>
</html>
